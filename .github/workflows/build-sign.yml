name: build-sign

# Phase 3 — the supply-chain centerpiece. Build the image, generate an SBOM,
# scan it, then SIGN it and ATTEST the SBOM with cosign KEYLESS (Sigstore, using
# this workflow's OIDC identity — no private keys). Push everything to GHCR.
# Kyverno on the cluster later verifies that signature before admitting the Pod.
on:
  push:
    branches: [ main, master ]
    paths: [ 'app/**', '.github/workflows/build-sign.yml' ]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/vault-api

permissions:
  contents: read
  packages: write        # push to GHCR
  id-token: write        # OIDC token for keyless cosign signing

jobs:
  build-sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: app
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          # both tags share one digest; we sign the digest, so both are covered.

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Install syft
        run: curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Trivy image scan (report-only)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          severity: HIGH,CRITICAL
          exit-code: '0'          # -> '1' to block on vulnerable images

      - name: Generate SBOM (CycloneDX)
        run: syft "${IMAGE}@${{ steps.build.outputs.digest }}" -o cyclonedx-json > sbom.cdx.json

      - name: Sign image (keyless)
        run: cosign sign --yes "${IMAGE}@${{ steps.build.outputs.digest }}"

      - name: Attest SBOM (keyless)
        run: |
          cosign attest --yes --type cyclonedx \
            --predicate sbom.cdx.json \
            "${IMAGE}@${{ steps.build.outputs.digest }}"

      - name: Report what to deploy
        run: |
          echo "### Signed image" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${IMAGE}@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with: { name: sbom, path: sbom.cdx.json }
